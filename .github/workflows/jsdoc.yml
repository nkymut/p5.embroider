# Test + build check on every PR, then deploy static content to GitHub Pages
# from main. Merging a PR pushes to main, so a merge runs the check and, only
# if it passes, the deploy. GitHub Pages serves the committed lib/ as the CDN,
# so the check fails when lib/p5.embroider.js was not rebuilt from src/.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch (including PR merges)
  push:
    branches: ["main"]

  # Checks pull requests before they are merged (no deploy)
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests + "is the committed lib/ built from src/?"
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 18+ required by rollup 4, jest 30 and canvas 3
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Check lib/ is up to date
        run: |
          if ! git diff --quiet -- lib/p5.embroider.js; then
            echo "::error file=lib/p5.embroider.js::lib/p5.embroider.js is out of date with src/. Run 'pnpm build' and commit the result."
            git diff --stat -- lib/p5.embroider.js
            exit 1
          fi

  # Single deploy job, only from main and only after the check passes
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate jsdocs
        run: pnpm jsdoc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload both the docs directory and the lib directory
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
